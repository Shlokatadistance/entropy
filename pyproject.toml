[project]
name = "entropy"
version = "0.1.0"
description = "Different ways of looking at the heap"
authors = [
    {name = "Shlok Sinha",email = "ssinha@flowtraders.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ruff (>=0.16.3,<0.17.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]